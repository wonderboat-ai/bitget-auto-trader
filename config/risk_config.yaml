# =============================================================
# Configuração de RISCO — o coração do sistema.
# Estes limites são NÃO-NEGOCIÁVEIS em runtime. O motor de decisão
# (e futuramente o LLM) não pode reescrevê-los. Mudança aqui é manual.
# =============================================================

market:
  # "perp" = perpétuos USDT (comportamento original) | "spot" = à vista.
  # Decisão #E do Lucas (15/07/2026): migrar para SPOT (Bybit Brasil) — perpétuos
  # ficaram inviáveis para residente BR. Em spot o sistema é FAIL-CLOSED:
  # sinais SHORT são vetados, alavancagem forçada a 1, exposição total limitada
  # a 1x o equity (sem margem). Virar para "spot" é mudança manual e deliberada,
  # como tudo neste arquivo.
  # REVERTIDO para "perp" em 28/07/2026, decisão explícita do Lucas ("liga long
  # e short em derivativos") — verificado antes por sonda só-leitura que a
  # chave de API de mainnet configurada tem permissão de ContractTrade/
  # Derivatives (LEVEL_2 KYC, unifiedMarginStatus=5). ATENÇÃO: isso NÃO
  # confirma que a Bybit vai aceitar a ordem em si — o bloqueio de compliance
  # de 15/07/2026 (retCode 10024/KYC_PROMPT_TOAST) acontecia na CRIAÇÃO da
  # ordem, não na permissão da chave; a primeira entrada real em perp é o
  # teste de verdade. Se cair no mesmo bloqueio, volta pra "spot".
  type: "perp"

account:
  # Capital de referência para sizing (em USDT). Em testnet, valor fictício.
  base_capital_usdt: 1000.0

per_trade:
  # % do capital arriscado por trade (distância até o stop define o size).
  risk_pct: 0.5            # 0.5% do capital por trade
  # Stop-loss é OBRIGATÓRIO. Sem stop, o trade é vetado.
  require_stop_loss: true
  # Alavancagem máxima permitida por posição. BAIXADO de 3 para 2 em
  # 28/07/2026, decisão explícita do Lucas ao religar perp/short ("2x") —
  # o cálculo em risk_manager.evaluate() é min(max_leverage, necessária
  # pelo notional/equity), então este valor é o TETO real.
  max_leverage: 2
  # Teto de capital por trade INDIVIDUAL, em % do equity (decisão do Lucas,
  # 17/07/2026). Motivo: o sizing por risco fixo (risk_pct / distância do
  # stop) não tinha teto próprio — só o agregado de portfólio (abaixo). Com
  # stop apertado, um único trade podia consumir quase todo o equity (visto
  # ao vivo: ~84% numa entrada só). Quando o size pelo risco excederia este
  # teto, o RiskManager REDUZ o tamanho pra caber (nunca aumenta risco, só
  # diminui) — a entrada acontece, só menor, deixando caixa pra outros trades.
  # ELEVADO de 20.0 para 100.0 em 27/07/2026 (equity pequeno, ver histórico).
  # BAIXADO de 100.0 para 50.0 em 28/07/2026, decisão do Lucas ("equity 50%
  # pra cada BTC e ETH"): é um teto POR TRADE, não por símbolo (o código não
  # tem alocação dedicada por símbolo) — com só BTC/USDT e ETH/USDT
  # configurados, um teto de 50% em cada trade individual impede que um
  # símbolo sozinho consuma o equity que o outro precisaria, aproximando o
  # 50/50 pedido na prática. Não é uma reserva rígida por símbolo (se só um
  # sinal aparecer, ele usa até 50%, não os 100%; o resto fica em caixa).
  max_notional_pct_equity: 50.0

portfolio:
  # Nº máximo de posições abertas simultâneas.
  max_open_positions: 3
  # Exposição nocional máxima como múltiplo do capital base.
  max_total_exposure_mult: 2.0
  # Risco agregado máximo em aberto (soma do risco de todas as posições).
  max_aggregate_risk_pct: 2.0

drawdown:
  # Perda diária máxima (%) antes do KILL SWITCH disparar.
  # Ao atingir: zera exposição e BLOQUEIA novas entradas até reset manual.
  max_daily_drawdown_pct: 3.0
  # Perda máxima total desde o início antes de parada total.
  max_total_drawdown_pct: 15.0

cooldown:
  # Pausa entradas NOVAS no mesmo símbolo depois de stops — decisão do Lucas
  # em 21/07/2026, depois que o watchdog agendado achou um whipsaw real no
  # ETH/USDT: 5 stops em 8 minutos, porque nada impedia reentrada imediata no
  # mesmo sinal (candle de 15m ainda não tinha virado — a mesma aprovação
  # repetia). Investigado (research/ + workflow de análise): confirmado que
  # o ETH real não se moveu no mercado (mainnet ficou lateral); foi anomalia
  # de dado da testnet, mas o problema de ARQUITETURA é real independente da
  # causa — nada impedia reentrada repetida. Trata o SINTOMA (chop/
  # reentrada), não a causa específica.
  #
  # ENDURECIDO em 25/07/2026, a pedido do Lucas: ele viu o motor tomar 1 stop
  # e reentrar comprado quase na hora, e questionou se não valeria a pena
  # "acalmar" antes de tentar de novo — pergunta com peso real, já que a
  # pesquisa de estratégia (16/07, 21/07) mostrou 2x que esta família
  # (EMA/RSI, stop/TP fixos) é a PIOR testada. Antes, precisava de 2 stops
  # SEGUIDOS no mesmo símbolo pra acionar qualquer pausa; agora CADA stop já
  # pausa, com 3 níveis de severidade por dia (UTC), por símbolo:
  #   1º stop do dia  -> 30min  (cooldown_minutes_first)
  #   2º stop do dia  -> 60min  (cooldown_minutes_escalated)
  #   3º stop em diante -> 24h (cooldown_minutes_max) — auto-libera sozinho
  #     no prazo, ou reset manual antes via MCP `trader_reset_cooldown`
  #     (ação deliberada do operador, mesma filosofia do kill switch).
  # Take-profit no meio continua quebrando a sequência de `consecutive_stops`
  # (não conta como stop) — só que com o gatilho em 1, isso não muda nada na
  # prática: cada stop isolado já aciona por conta própria, TP antes ou não.
  consecutive_stops_trigger: 1    # cada stop já conta (antes exigia 2 seguidos)
  cooldown_minutes_first: 30      # 1º stop do dia (por símbolo)
  cooldown_minutes_escalated: 60  # 2º stop do dia
  cooldown_minutes_max: 1440      # 3º stop em diante — 24h

circuit_breakers:
  # Funding rate anômalo (abs) que suspende novas entradas.
  max_abs_funding_rate: 0.003
  # Usado SÓ quando ENVIRONMENT=testnet: lá o funding vive no clamp da exchange
  # (±0.005) por book raso, o que vetava toda entrada da Fase 1. Mainnet não muda.
  max_abs_funding_rate_testnet: 0.01
  # Segundos sem dado novo de mercado antes de considerar feed perdido.
  max_data_staleness_sec: 60
  # Slippage máximo tolerado vs preço esperado (%) — acima disso, cancela.
  max_slippage_pct: 0.5

decision:
  # Qual camada de decisão gera o Signal: "deterministic" (Fase 1/2) ou "llm" (Fase 3).
  strategy: "deterministic"
  # Chaves da estratégia determinística — construídas e testadas em 21/07/2026
  # (saída por sinal + trailing stop), mas deixadas OFF até hoje por decisão
  # explícita do Lucas. Ligadas em 22/07/2026 a pedido dele, depois da
  # pesquisa 2b confirmar (2 datasets independentes) que a estratégia atual
  # (EMA20/50+RSI, stop/TP fixos) é a PIOR família testada — nenhuma
  # alternativa (donchian/ema_cross) validou edge suficiente pra promoção,
  # então a melhoria disponível agora é de GESTÃO DE SAÍDA na mesma
  # estratégia, não de troca de família (ver
  # research/RELATORIO-2026-07-21-pesquisa-2b.md).
  deterministic:
    # Sobe o stop junto com o preço em vez de deixar fixo — trava lucro que
    # já rodou a favor em vez de devolver tudo até o stop original numa
    # reversão. TP passa a ser None quando trailing=true (o stop que sobe É
    # a realização, ver Signal.trailing/executor.py). Só afeta ENTRADAS
    # NOVAS a partir de agora — as posições já abertas antes deste boot
    # mantêm o stop/TP fixo com que foram abertas.
    trailing: true
  # Config da camada Claude (usada só quando strategy: llm).
  llm:
    # Atualizado 22/07/2026 — "claude-sonnet-4-6" estava desatualizado
    # (pendência já sinalizada no CLAUDE.md desde a implementação original).
    model: "claude-sonnet-5"
    temperature: 0.2
    min_conviction: 0.6   # abaixo disso, o trade é tratado como flat

trading:
  symbols:
    - "BTC/USDT:USDT"
    - "ETH/USDT:USDT"
  # Perfis de horizonte. Cada um pode ter pesos/parâmetros próprios.
  profiles:
    daytrade:
      timeframe: "15m"
      # DESLIGADO em 18/08/2026, decisão explícita do Lucas depois da pesquisa
      # 3 (research/RELATORIO-2026-08-18-pesquisa-3-perp.md).
      #
      # Causa raiz: com o teto de nocional de 50% do equity MORDENDO em 90% dos
      # sinais reais (confirmado na trilha do PC2), o nocional fica constante e
      # a fee vira uma fração fixa do nocional — enquanto 1R encolhe junto com
      # a distância do stop. A identidade é fee/R = 0,11% ÷ stop%. Em 15m o
      # stop mediano REAL é 0,40% do preço, então a fee come ~27% de cada 1R
      # antes de qualquer consideração de estratégia. Em 4h o stop mediano é
      # 1,55% e a fee cai para ~7%.
      #
      # Medido (BTC+ETH, o universo real deste YAML, últimos 12 meses):
      # mediana -97,20%, R/trade -0,3525, 9.401 trades, 1.317 USDT de fee sobre
      # 2.000 de capital inicial. Em 3 anos e 8 símbolos: -98,00%, 0/8
      # positivos, t até -28,58. É a estatística mais forte de todo o estudo —
      # a evidência de que este perfil perde é MAIS forte que a evidência de
      # qualquer estratégia candidata ganhar.
      #
      # Este perfil respondia por 16 dos 33 order_executed reais do PC2 (48,5%).
      # Religar é uma linha — mas só com evidência nova de que a fricção de 15m
      # foi resolvida (ordem limit/maker, stop mais largo, ou nocional maior).
      enabled: false
    swing:
      timeframe: "4h"
      enabled: true
